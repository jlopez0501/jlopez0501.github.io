    <script>
      function makeWorm(id, offset) {
        const c = document.getElementById(id).getContext('2d');
        const W = 80;
        let p = 0;

        (function draw() {
          const H = innerHeight;
          c.canvas.height = H;
          c.clearRect(0, 0, W, H);
          c.strokeStyle = '#378ADD';
          c.lineWidth = 35;
          c.beginPath();
          for (let y = 0; y <= H; y++) {
            const x = 55 + 25 * Math.sin((y / H) * Math.PI * 3 - p);
            y ? c.lineTo(x, y) : c.moveTo(x, y);
          }
          c.stroke();

          // eyes follow the wave
          const eyeY1 = 18;
          const eyeY2 = 30;
          const eyeX1 = 55 + 25 * Math.sin((eyeY1 / H) * Math.PI * 3 - p);
          const eyeX2 = 55 + 25 * Math.sin((eyeY2 / H) * Math.PI * 3 - p);

          c.fillStyle = '#000';
          c.beginPath(); c.arc(eyeX1 - 6, eyeY1, 4, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(eyeX1 + 6, eyeY1, 4, 0, Math.PI * 2); c.fill();

          p += 0.04;
          requestAnimationFrame(draw);
        })();
      }

    makeWorm('w1', 0);
    makeWorm('w2', Math.PI);
  </script>
